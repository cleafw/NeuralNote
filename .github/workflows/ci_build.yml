name: Build and publish installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate version and prepare release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_release.py
  windows:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build_windows.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
  macos-arm64:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build_macos.yml
    with:
      arch: arm64
      release-tag: ${{ needs.prepare.outputs.tag }}
  macos-intel:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build_macos.yml
    with:
      arch: x86_64
      release-tag: ${{ needs.prepare.outputs.tag }}
  linux:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build_linux.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
  publish:
    needs: [prepare, windows, macos-arm64, macos-intel, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check packages and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/publish_release.py
