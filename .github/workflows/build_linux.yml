name: Build Linux Vulkan packages
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang-20
      CXX: clang++-20
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Clang 20 and dependencies
        run: |
          curl --fail --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 g++-14 ninja-build ccache pkg-config python3 dpkg-dev \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libvulkan-dev glslc spirv-headers
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ccache
            NeuralNote/Assets/SoundFont
          key: linux-x64-${{ hashFiles('Tools/*soundfont.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: linux-x64-
      - name: Build application and VST3 with Vulkan
        run: python3 .github/scripts/configure_and_build.py
      - name: Package and inspect dependencies
        run: python3 .github/scripts/package_release.py linux
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
