name: Build macOS without paid certificates
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      release-tag:
        type: string
        required: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install ccache ninja
          xcrun -sdk macosx metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ccache
            NeuralNote/Assets/SoundFont
          key: macos-${{ inputs.arch }}-${{ hashFiles('Tools/*soundfont.py', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: macos-${{ inputs.arch }}-
      - name: Build application and plugins with Metal
        env:
          ARCH: ${{ inputs.arch }}
        run: python3 .github/scripts/configure_and_build.py --arch "$ARCH"
      - name: Ad-hoc sign and package (no Developer ID, no notarization)
        env:
          ARCH: ${{ inputs.arch }}
        run: python3 .github/scripts/package_release.py macos --arch "$ARCH"
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
